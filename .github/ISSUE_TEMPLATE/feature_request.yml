name: Feature or destination request
description: Suggest a feature or a new upload destination
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the problem or workflow, not just the solution.
    validations:
      required: true
  - type: input
    id: destination
    attributes:
      label: Destination (if this is a destination request)
      placeholder: Imgur, Google Drive, WebDAV...
  - type: textarea
    id: extra
    attributes:
      label: Anything else
