name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # A service container cannot pass "server /data" to MinIO, so it is started as a normal step.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin             quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy"
          docker logs minio
          exit 1

      - name: Create MinIO bucket
        run: |
          curl -sSfL -o mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          ./mc alias set local http://localhost:9000 minioadmin minioadmin
          ./mc mb --ignore-existing local/sharedroid

      - name: Unit and MinIO integration tests
        env:
          S3_IT_ENDPOINT: localhost:9000
        run: ./gradlew :s3:test :http:test :ftp:test :app:testDebugUnitTest

      - name: Build and lint the app
        run: ./gradlew :app:assembleDebug :app:lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sharedroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: '**/build/reports/'
